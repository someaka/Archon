name: plan-with-claude-implement-with-hermes
description: Plan with Claude, implement with a local Hermes model

nodes:
  - id: plan
    prompt: |
      Create a detailed implementation plan for: $USER_MESSAGE
    provider: claude
    model: sonnet
  - id: implement
    prompt: |
      Implement the plan. Write clean, well-tested code.

      Plan:
      $PLAN_OUTPUT
    provider: hermes
    depends_on: [plan]
